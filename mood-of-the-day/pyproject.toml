[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mood-of-the-day"
version = "0.1.0"
description = "A Linux desktop app that displays a personalized famous quotation each day."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "tcoxav" },
]
keywords = ["quotation", "desktop", "linux", "personalization", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]

dependencies = [
    "PySide6>=6.5,<7",
    "openai>=1.30,<2",
    "google-genai>=1.0,<2",
    "platformdirs>=4.0,<5",
    "keyring>=25.0,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
]

[project.scripts]
mood-of-the-day = "mood.main:main"

[tool.setuptools.packages.find]
include = ["mood*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
